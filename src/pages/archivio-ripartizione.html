<section class="page-ripartizione page-archivio-rip">
  <div
    class="rip-head"
    title="Quote dei periodi archiviati per il rendiconto selezionato. Doppio clic su proprietà o occupante per filtrare. Usa Ripristina per riportare un periodo tra le spese attive."
  >
    <button type="button" class="btn btn-secondary btn-torna-archivio" id="btn-torna-archivio">
      ← Archivio
    </button>
    <h1 class="rip-archivio-titolo">
      Ripartizione — <span id="rip-archivio-titolo-rendiconto">—</span>
    </h1>

    <div class="filtri-riga" id="filtri-riga">
      <div class="filtro-chip" id="filtro-proprieta" hidden>
        <span class="filtro-chip-lbl">Proprietà</span>
        <strong id="filtro-proprieta-nome"></strong>
        <button type="button" class="btn-chip-togli" id="btn-togli-filtro-proprieta" title="Togli filtro proprietà">×</button>
      </div>
      <div class="filtro-chip" id="filtro-occupante" hidden>
        <span class="filtro-chip-lbl">Occupante</span>
        <strong id="filtro-occupante-nome"></strong>
        <button type="button" class="btn-chip-togli" id="btn-togli-filtro-occupante" title="Togli filtro occupante">×</button>
      </div>
    </div>

    <div class="rip-head-azioni">
      <button type="button" class="btn btn-secondary btn-rip-date" id="btn-stampa-rip">
        Stampa
      </button>
      <div class="rip-totale-head" id="rip-totale-head" hidden>
        <span class="rip-totale-lbl">Totale visualizzato</span>
        <strong id="rip-totale-val">€ 0,00</strong>
      </div>
    </div>
  </div>

  <p class="form-error" id="rip-error" hidden></p>
  <p class="muted" id="rip-vuoto" hidden>
    Nessuna ripartizione per questo rendiconto.
  </p>

  <div id="rip-corpo"></div>

  <!-- Solo per stampa/PDF (nascosto a schermo) -->
  <div id="rip-stampa" class="rip-stampa" hidden aria-hidden="true"></div>
</section>
